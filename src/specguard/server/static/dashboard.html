<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpecGuard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>

<header class="masthead">
  <div class="masthead__left">
    <span class="wordmark">SpecGuard</span>
    <span class="masthead__rule" aria-hidden="true"></span>
    <span class="repo" id="repo">loading…</span>
  </div>
  <div class="masthead__right">
    <button id="runBtn" class="btn" type="button">Run check</button>
    <span class="conn" id="conn" title="Live event stream">
      <span class="conn__dot" aria-hidden="true"></span><span id="connText">connecting</span>
    </span>
  </div>
</header>

<div class="ribbon-wrap">
  <div class="ribbon" id="ribbon" role="group" aria-label="Drift ribbon: one tick per rule"></div>
</div>

<div class="stats" id="stats">
  <div class="stat stat--score">
    <span class="stat__label">Drift score</span>
    <span class="stat__value" id="statScore">—</span>
  </div>
  <div class="stat"><span class="stat__label">Aligned</span><span class="stat__value stat__value--aligned" id="statAligned">—</span></div>
  <div class="stat"><span class="stat__label">Drifted</span><span class="stat__value stat__value--drifted" id="statDrifted">—</span></div>
  <div class="stat"><span class="stat__label">Needs human</span><span class="stat__value stat__value--human" id="statHuman">—</span></div>
  <div class="stat"><span class="stat__label">Unmapped</span><span class="stat__value stat__value--unmapped" id="statUnmapped">—</span></div>
  <div class="stat stat--meta"><span class="stat__label">Model</span><span class="stat__value stat__value--meta" id="statModel">—</span></div>
</div>

<main class="board">
  <aside class="pane pane--flow" aria-label="Pipeline progress">
    <div class="pane__head">
      <span class="eyebrow">Pipeline</span>
      <span class="flow__clock" id="flowClock">idle</span>
    </div>
    <ol class="flow" id="flow"></ol>
    <div class="flow__outcome" id="flowOutcome" data-s="idle">No run yet.</div>
  </aside>

  <section class="pane pane--rules" aria-label="Rules">
    <div class="pane__head">
      <span class="eyebrow">Rules</span>
      <div class="chips" id="filters" role="group" aria-label="Filter rules">
        <button class="chip is-on" data-filter="all" type="button">All</button>
        <button class="chip" data-filter="DRIFTED" type="button">Drifted</button>
        <button class="chip" data-filter="NEEDS_HUMAN" type="button">Needs human</button>
        <button class="chip" data-filter="ALIGNED" type="button">Aligned</button>
      </div>
    </div>
    <div class="rulelist" id="ruleList"></div>
  </section>

  <aside class="pane pane--evidence" id="evidencePane" aria-label="Evidence">
    <div class="pane__head">
      <span class="eyebrow">Evidence</span>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="Close evidence">Close</button>
    </div>
    <div class="evidence" id="evidence"></div>
  </aside>
</main>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script src="/static/dashboard.js"></script>
</body>
</html>
