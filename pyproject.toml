[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specguard"
version = "0.1.0"
description = "AI-powered specification-drift detection"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "rich>=13.7",
    "httpx>=0.27",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
specguard = "specguard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
specguard = ["server/static/*", "hooks/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
